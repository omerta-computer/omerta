name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: install
        run: npm ci
      - name: build
        run: npm run build
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shell syntax
        run: for f in chain/scripts/*.sh; do bash -n "$f"; done
